name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto (si lo subiste como Candado.zip)
        run: |
          if [ -f Candado.zip ]; then unzip -o -q Candado.zip -d . ; fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Candado.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Candado-apk
          path: Candado.apk

      - name: Publicar descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Candado v1.0.${{ github.run_number }}
          body: "Descarga **Candado.apk** desde el celular y ábrelo para instalar."
          files: Candado.apk
